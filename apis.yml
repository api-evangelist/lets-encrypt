aid: lets-encrypt
name: Let's Encrypt
description: >-
  Let's Encrypt is a free, automated, and open certificate authority run by the Internet Security Research Group
  affiliated with the Linux Foundation. It provides TLS certificates to secure the web, having issued billions of
  certificates to enable HTTPS for websites worldwide via the ACME protocol.
