naftiko: 1.0.0-alpha2
info:
  label: Let's Encrypt ACME API — Order
  description: 'Let''s Encrypt ACME API — Order. 3 operations. Lead operation: Finalize an order with a CSR. Self-contained
    Naftiko capability covering one Lets Encrypt business surface.'
  tags:
  - Lets Encrypt
  - Order
  created: '2026-05-19'
  modified: '2026-05-19'
binds:
- namespace: env
  keys:
    LETS_ENCRYPT_API_KEY: LETS_ENCRYPT_API_KEY
capability:
  consumes:
  - type: http
    namespace: acme-order
    baseUri: https://acme-v02.api.letsencrypt.org
    description: Let's Encrypt ACME API — Order business capability. Self-contained, no shared references.
    resources:
    - name: acme-finalize-orderId
      path: /acme/finalize/{orderId}
      operations:
      - name: finalizeorder
        method: POST
        description: Finalize an order with a CSR
        outputRawFormat: json
        outputParameters:
        - name: result
          type: object
          value: $.
        inputParameters:
        - name: orderId
          in: path
          type: string
          required: true
        - name: body
          in: body
          type: object
          description: Request body (JSON).
          required: true
    - name: acme-new-order
      path: /acme/new-order
      operations:
      - name: neworder
        method: POST
        description: Submit a new certificate order
        outputRawFormat: json
        outputParameters:
        - name: result
          type: object
          value: $.
        inputParameters:
        - name: body
          in: body
          type: object
          description: Request body (JSON).
          required: true
    - name: acme-order-orderId
      path: /acme/order/{orderId}
      operations:
      - name: getorder
        method: POST
        description: Get order status
        outputRawFormat: json
        outputParameters:
        - name: result
          type: object
          value: $.
        inputParameters:
        - name: orderId
          in: path
          type: string
          required: true
        - name: body
          in: body
          type: object
          description: Request body (JSON).
          required: true
  exposes:
  - type: rest
    namespace: acme-order-rest
    port: 8080
    description: REST adapter for Let's Encrypt ACME API — Order. One Spectral-compliant resource per consumed operation,
      prefixed with /v1.
    resources:
    - path: /v1/acme/finalize/{orderid}
      name: acme-finalize-orderid
      description: REST surface for acme-finalize-orderId.
      operations:
      - method: POST
        name: finalizeorder
        description: Finalize an order with a CSR
        call: acme-order.finalizeorder
        with:
          orderId: rest.orderId
          body: rest.body
        outputParameters:
        - type: object
          mapping: $.
    - path: /v1/acme/new-order
      name: acme-new-order
      description: REST surface for acme-new-order.
      operations:
      - method: POST
        name: neworder
        description: Submit a new certificate order
        call: acme-order.neworder
        with:
          body: rest.body
        outputParameters:
        - type: object
          mapping: $.
    - path: /v1/acme/order/{orderid}
      name: acme-order-orderid
      description: REST surface for acme-order-orderId.
      operations:
      - method: POST
        name: getorder
        description: Get order status
        call: acme-order.getorder
        with:
          orderId: rest.orderId
          body: rest.body
        outputParameters:
        - type: object
          mapping: $.
  - type: mcp
    namespace: acme-order-mcp
    port: 9090
    transport: http
    description: MCP adapter for Let's Encrypt ACME API — Order. One tool per consumed operation, routed inline through this
      capability's consumes block.
    tools:
    - name: finalize-order-csr
      description: Finalize an order with a CSR
      hints:
        readOnly: false
        destructive: false
        idempotent: false
      call: acme-order.finalizeorder
      with:
        orderId: tools.orderId
        body: tools.body
      outputParameters:
      - type: object
        mapping: $.
    - name: submit-new-certificate-order
      description: Submit a new certificate order
      hints:
        readOnly: false
        destructive: false
        idempotent: false
      call: acme-order.neworder
      with:
        body: tools.body
      outputParameters:
      - type: object
        mapping: $.
    - name: get-order-status
      description: Get order status
      hints:
        readOnly: true
        destructive: false
        idempotent: false
      call: acme-order.getorder
      with:
        orderId: tools.orderId
        body: tools.body
      outputParameters:
      - type: object
        mapping: $.
